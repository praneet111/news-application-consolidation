{% extends 'base.html' %}

{% block content %}

<h1>Publisher Form</h1>

<a href="{% url 'publisher_list' %}" class="btn btn-secondary mb-3">
    Back to Publishers
</a>

<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="btn btn-primary">
        Save Publisher
    </button>
</form>

{% endblock %}
