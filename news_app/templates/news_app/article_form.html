{% extends 'base.html' %}

{% block content %}

<h1>Article Form</h1>

<a href="{% url 'dashboard' %}" class="btn btn-secondary mb-3">
    Back to Dashboard
</a>

<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Save Article
    </button>
</form>

{% endblock %}
